<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>迷枪苹果区兼容</title>
  <style>
    :root{font-family:system-ui,"Noto Sans SC",sans-serif;background:#0c1020;color:#f0f4ff}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:radial-gradient(circle at 90% 0,#213b65,#0c1020 42%);min-height:100vh}
    main{max-width:620px;margin:auto}.eyebrow{color:#8eb7ff;font-size:12px;font-weight:700;letter-spacing:.15em}h1{font-size:25px;margin:8px 0}p{color:#aebcd4;line-height:1.6}h2{font-size:16px;margin:0}
    .card{background:#171f33;border:1px solid #2c3955;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 12px 32px #0002}
    .row{display:flex;justify-content:space-between;align-items:center;gap:20px}.sub{font-size:13px;color:#9dadc7;margin:7px 0 0;overflow-wrap:anywhere}
    .switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.track{position:absolute;inset:0;background:#4a5771;border-radius:20px;pointer-events:none;transition:.2s}.track:before{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.track{background:#4f97fa}.switch input:checked+.track:before{transform:translateX(22px)}.switch input:focus-visible+.track{outline:2px solid white;outline-offset:3px}.switch input:disabled+.track{opacity:.5}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}button{border:1px solid #4c76b3;border-radius:10px;background:#243d61;color:#e9f2ff;font:inherit;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1120;border:1px solid #2b3a54;border-radius:12px;padding:13px;min-height:140px;max-height:48vh;overflow:auto;font:12px/1.55 ui-monospace,monospace;color:#c8dbf6}#status{font-size:13px;min-height:20px;color:#9fc9ff}
  </style>
</head>
<body><main>
  <div class="eyebrow">Zygisk · v0.5.3</div><h1>迷枪苹果区兼容</h1>
  <p>分别控制游戏和 Hunter 的模块加载。开关保存后，完全退出目标应用再打开即可生效。</p>
  <section class="card row"><div><h2>游戏兼容</h2><div class="sub">com.miniworldroyale.sparkgame</div></div><label class="switch"><input id="game" type="checkbox" disabled aria-label="游戏兼容"><span class="track"></span></label></section>
  <section class="card row"><div><h2>Hunter 检查</h2><div class="sub">com.zhenxi.hunter</div></div><label class="switch"><input id="hunter" type="checkbox" disabled aria-label="Hunter 检查"><span class="track"></span></label></section>
  <section class="card"><div class="toolbar"><h2>模块日志</h2><button id="refresh" type="button">刷新日志</button></div><p>仅显示本模块的加载、Hook 和登录过滤状态；不记录手机号或凭据。</p><pre id="logs">正在读取…</pre></section>
  <p id="status" role="status"></p>
</main><script>
  'use strict';
  const moduleId='minifire_compat_zygisk';
  const statusPattern=/^game=([01])\r?\nhunter=([01])\s*$/m;
  let script=null;
  const game=document.getElementById('game'),hunter=document.getElementById('hunter');
  const status=document.getElementById('status'),logs=document.getElementById('logs');
  function findScript(){
    if(!window.ksu||typeof window.ksu.exec!=='function') throw Error('请从支持 WebUI 的 Root 管理器打开此页面');
    if(script) return script;
    const dirs=['/data/adb/modules/'+moduleId];
    if(typeof window.ksu.moduleInfo==='function'){
      try{
        const info=JSON.parse(window.ksu.moduleInfo());
        if(info.id===moduleId && /^\/data\/adb\/modules(?:_update)?\/minifire_compat_zygisk$/.test(info.moduleDir)) dirs.push(info.moduleDir);
      }catch(_error){}
    }
    dirs.push('/data/adb/modules_update/'+moduleId);
    for(const dir of new Set(dirs)){
      const candidate='sh '+dir+'/control.sh';
      const output=window.ksu.exec(candidate+' status');
      if(typeof output==='string' && statusPattern.test(output)){script=candidate;return script;}
    }
    throw Error('配置读取失败：未找到已安装模块的控制脚本，请确认 Root 管理器中的模块位置');
  }
  function run(argument){
    const command=findScript()+' '+argument;
    const output=window.ksu.exec(command);
    if(typeof output!=='string') throw Error('Root 管理器没有返回命令结果');
    return output;
  }
  function show(message){status.textContent=message;}
  function readStatus(message='开关已读取'){
    try{
      const output=run('status');
      const match=statusPattern.exec(output);
      if(!match) throw Error('配置读取失败：'+output);
      game.checked=match[1]==='1';hunter.checked=match[2]==='1';
      game.disabled=false;hunter.disabled=false;show(message);
    }catch(error){game.disabled=true;hunter.disabled=true;show(String(error));}
  }
  function update(target){
    game.disabled=true;hunter.disabled=true;
    try{
      const output=run(target.id+' '+(target.checked?'1':'0')).trim();
      if(output!==(target.checked?'1':'0')) throw Error('写入后读回不一致');
      readStatus('已保存；重开目标应用后生效');
    }catch(error){readStatus('保存失败：'+error);}
  }
  game.addEventListener('change',()=>update(game));hunter.addEventListener('change',()=>update(hunter));
  function refresh(){try{logs.textContent=run('logs').trim()||'暂无模块日志。启动目标应用后再刷新。';}catch(error){logs.textContent='读取日志失败：'+error;}}
  document.getElementById('refresh').addEventListener('click',refresh);
  readStatus();refresh();
</script></body></html>
