<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>迷枪苹果区兼容</title>
  <style>
    :root{font-family:system-ui,"Noto Sans SC",sans-serif;background:#0c1020;color:#f0f4ff}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px 40px;background:radial-gradient(circle at 90% 0,#213b65,#0c1020 42%);min-height:100vh}
    main{max-width:620px;margin:auto}.eyebrow{color:#8eb7ff;font-size:12px;font-weight:700;letter-spacing:.15em}h1{font-size:25px;margin:8px 0}p{color:#aebcd4;line-height:1.6}h2{font-size:16px;margin:0}
    .card{background:#171f33;border:1px solid #2c3955;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 12px 32px #0002}
    .row{display:flex;justify-content:space-between;align-items:center;gap:20px}.sub{font-size:13px;color:#9dadc7;margin:7px 0 0;overflow-wrap:anywhere}
    .switch{position:relative;width:52px;height:30px;flex:none}.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.track{position:absolute;inset:0;background:#4a5771;border-radius:20px;pointer-events:none;transition:.2s}.track:before{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.track{background:#4f97fa}.switch input:checked+.track:before{transform:translateX(22px)}.switch input:focus-visible+.track{outline:2px solid white;outline-offset:3px}.switch input:disabled+.track{opacity:.5}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}button{border:1px solid #4c76b3;border-radius:10px;background:#243d61;color:#e9f2ff;font:inherit;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1120;border:1px solid #2b3a54;border-radius:12px;padding:13px;min-height:140px;max-height:48vh;overflow:auto;font:12px/1.55 ui-monospace,monospace;color:#c8dbf6}#status{font-size:13px;min-height:20px;color:#9fc9ff}
  </style>
</head>
<body><main>
  <div class="eyebrow">Zygisk · v0.6.2</div><h1>迷枪苹果区兼容</h1>
  <p>分别控制游戏和 Hunter 的模块加载。开关保存后，完全退出目标应用再打开即可生效。</p>
  <section class="card row"><div><h2>游戏兼容</h2><div class="sub">com.miniworldroyale.sparkgame</div></div><label class="switch"><input id="game" type="checkbox" disabled aria-label="游戏兼容"><span class="track"></span></label></section>
  <section class="card row"><div><h2>Hunter 检查</h2><div class="sub">com.zhenxi.hunter</div></div><label class="switch"><input id="hunter" type="checkbox" disabled aria-label="Hunter 检查"><span class="track"></span></label></section>
  <section class="card"><div class="toolbar"><h2>系统日志</h2><div><button id="refresh" type="button">刷新日志</button> <button id="copy" type="button">复制诊断</button></div></div><p>显示当前 logcat 快照最近最多 1500 行（main、system、crash）。每次刷新时快照会随系统日志变化；分享前请检查其他应用的隐私信息。</p><div id="loginfo" class="sub"></div><div id="copyinfo" class="sub"></div><pre id="logs">正在读取…</pre></section>
  <p id="status" role="status"></p>
</main><script>
  'use strict';
  const moduleId='minifire_compat_zygisk';
  const statusPattern=/^game=([01])\r?\nhunter=([01])\s*$/m;
  let backend=null;
  const game=document.getElementById('game'),hunter=document.getElementById('hunter');
  const status=document.getElementById('status'),logs=document.getElementById('logs'),loginfo=document.getElementById('loginfo'),copyinfo=document.getElementById('copyinfo');
  function bridge(){
    if(!window.ksu||typeof window.ksu.exec!=='function') throw Error('请从支持 WebUI 的 Root 管理器打开此页面');
    return window.ksu;
  }
  // KernelSU's synchronous WebView exec can return only the last stdout line.
  // Encode the complete command output as one line before it crosses the bridge.
  function shell(command){
    const encoded=bridge().exec('( '+command+' ) 2>&1 | base64 | tr -d "\\n"; printf "\\n"');
    if(typeof encoded!=='string') throw Error('Root 管理器没有返回命令结果');
    if(!encoded.trim()) return '';
    const binary=atob(encoded.trim());
    const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function findBackend(){
    if(backend) return backend;
    const ksu=bridge();
    const dirs=['/data/adb/modules/'+moduleId];
    let reported='未提供';
    if(typeof ksu.moduleInfo==='function'){
      try{
        const info=JSON.parse(ksu.moduleInfo());
        const dir=String(info.moduleDir||'').replace(/\/+$/,'');
        reported=dir||'未提供';
        if((!info.id||info.id===moduleId) && /^\/[A-Za-z0-9_./-]+$/.test(dir) &&
           !dir.split('/').some(part=>part==='.'||part==='..') && dir.endsWith('/'+moduleId)) dirs.push(dir);
      }catch(_error){}
    }
    dirs.push('/data/adb/modules_update/'+moduleId);
    let detail='';
    for(const dir of new Set(dirs)){
      const candidate='sh '+dir+'/control.sh';
      const output=shell(candidate+' status');
      if(typeof output==='string' && statusPattern.test(output)){
        backend={type:'script',command:candidate};return backend;
      }
      if(typeof output==='string' && output.trim()) detail=output.trim().slice(0,100);
    }
    for(const dir of new Set(dirs)){
      const output=shell('cat '+dir+'/game_enabled '+dir+'/hunter_enabled');
      if(typeof output==='string' && /^[01]\r?\n[01]\s*$/.test(output)){
        backend={type:'direct',dir};return backend;
      }
      if(typeof output==='string' && output.trim()) detail=output.trim().slice(0,100);
    }
    for(const dir of new Set(dirs)){
      const prop=shell('cat '+dir+'/module.prop');
      if(typeof prop!=='string' || !/^id=minifire_compat_zygisk\s*$/m.test(prop)) continue;
      const code=/^versionCode=(\d+)\s*$/m.exec(prop);
      if(!code || Number(code[1])<501) continue;
      const gameFile=dir+'/game_enabled',hunterFile=dir+'/hunter_enabled';
      const initialize="[ -f "+gameFile+" ] || { printf '0\\n' > "+gameFile+" && chmod 0644 "+gameFile+"; }; "+
        "[ -f "+hunterFile+" ] || { printf '0\\n' > "+hunterFile+" && chmod 0644 "+hunterFile+"; }; "+
        'cat '+gameFile+' '+hunterFile+' 2>&1';
      const output=shell(initialize);
      if(typeof output==='string' && /^[01]\r?\n[01]\s*$/.test(output)){
        backend={type:'direct',dir};return backend;
      }
      if(typeof output==='string' && output.trim()) detail=output.trim().slice(0,100);
    }
    const uid=String(shell('id -u')||'无输出').trim().slice(0,30);
    throw Error('配置读取失败：UID='+uid+'；目录='+reported+'；返回='+detail);
  }
  function run(argument){
    if(argument==='logs') return shell('logcat -d -b main -b system -b crash -v threadtime -t 1500');
    const active=findBackend();
    let command;
    if(active.type==='script') command=active.command+' '+argument;
    else if(argument==='status') command='cat '+active.dir+'/game_enabled '+active.dir+'/hunter_enabled 2>&1';
    else {
      const match=/^(game|hunter) ([01])$/.exec(argument);
      if(!match) throw Error('无效的开关操作');
      const path=active.dir+'/'+match[1]+'_enabled';
      command="printf '%s\\n' '"+match[2]+"' > "+path+'.tmp && chmod 0644 '+path+'.tmp && mv -f '+path+'.tmp '+path+' && cat '+path+' 2>&1';
    }
    const output=shell(command);
    if(active.type==='direct' && argument==='status'){
      const match=/^([01])\r?\n([01])\s*$/.exec(output);
      if(match) return 'game='+match[1]+'\nhunter='+match[2]+'\n';
    }
    return output;
  }
  function show(message){status.textContent=message;}
  function readStatus(message='开关已读取'){
    try{
      const output=run('status');
      const match=statusPattern.exec(output);
      if(!match) throw Error('配置读取失败：'+output);
      game.checked=match[1]==='1';hunter.checked=match[2]==='1';
      game.disabled=false;hunter.disabled=false;show(message);
    }catch(error){game.disabled=true;hunter.disabled=true;show(String(error));}
  }
  function update(target){
    game.disabled=true;hunter.disabled=true;
    try{
      const output=run(target.id+' '+(target.checked?'1':'0')).trim();
      if(output!==(target.checked?'1':'0')) throw Error('写入后读回不一致');
      readStatus('已保存；重开目标应用后生效');
    }catch(error){readStatus('保存失败：'+error);}
  }
  game.addEventListener('change',()=>update(game));hunter.addEventListener('change',()=>update(hunter));
  function refresh(){try{
    const value=run('logs').trim();
    logs.textContent=value||'暂无系统日志。';
    const count=value?value.split('\n').length:0;
    loginfo.textContent='本次快照：'+count+' 行（上限 1500 行）';
  }catch(error){logs.textContent='读取日志失败：'+error;loginfo.textContent='日志读取失败';}}
  document.getElementById('refresh').addEventListener('click',refresh);
  document.getElementById('copy').addEventListener('click',()=>{
    const value='模块：'+moduleId+'\n开关状态：'+status.textContent+'\n'+loginfo.textContent+'\n\n'+logs.textContent;
    if(typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(value).then(()=>copyinfo.textContent='诊断已复制',error=>copyinfo.textContent='复制失败：'+error);
      return;
    }
    try{
      const field=document.createElement('textarea');
      field.value=value;field.style.position='fixed';field.style.opacity='0';
      document.body.appendChild(field);field.select();
      const copied=document.execCommand('copy');field.remove();
      copyinfo.textContent=copied?'诊断已复制':'复制失败：请长按日志框选择文本';
    }catch(error){copyinfo.textContent='复制失败：'+error;}
  });
  readStatus();refresh();
</script></body></html>
